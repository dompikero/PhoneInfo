
name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project ZIP if needed
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find . -type f \( \
            -name 'settings.gradle' -o \
            -name 'settings.gradle.kts' \) \
            -not -path './.git/*' \
            -not -path '*/build/*' \
            -not -path '*/.gradle/*' \
            -print -quit || true)"

          if [ -n "$SETTINGS_FILE" ]; then
            echo "Gradle project found: $SETTINGS_FILE"
            exit 0
          fi

          ZIP_PATH=""
          for candidate in PhoneInfo.zip PhoneInfo-fixed2.zip PhoneInfo-fixed.zip; do
            if [ -f "$candidate" ]; then
              ZIP_PATH="$candidate"
              break
            fi
          done

          if [ -z "$ZIP_PATH" ]; then
            ZIP_PATH="$(find . -type f -name '*.zip' \
              -not -path './.git/*' -print -quit || true)"
          fi

          if [ -z "$ZIP_PATH" ]; then
            echo "ERROR: No Gradle project or ZIP archive found."
            ls -la
            exit 1
          fi

          echo "Unpacking: $ZIP_PATH"
          unzip -oq "$ZIP_PATH" -d .

          find . -type f \( \
            -name 'settings.gradle' -o \
            -name 'settings.gradle.kts' \) \
            -not -path './.git/*' -print

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Gradle project directory
        id: find
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find . -type f \( \
            -name 'settings.gradle' -o \
            -name 'settings.gradle.kts' \) \
            -not -path './.git/*' \
            -not -path '*/build/*' \
            -not -path '*/.gradle/*' \
            -print -quit || true)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            find . -maxdepth 5 -type f -print | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Enable AndroidX
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.find.outputs.dir }}"
          FILE="$PROJECT_DIR/gradle.properties"
          touch "$FILE"

          if grep -q '^android\.useAndroidX=' "$FILE"; then
            sed -i 's/^android\.useAndroidX=.*/android.useAndroidX=true/' "$FILE"
          else
            printf '\nandroid.useAndroidX=true\n' >> "$FILE"
          fi

          cat "$FILE"

      - name: Fix maxRange compatibility
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.find.outputs.dir }}"
          FILE="$PROJECT_DIR/app/src/main/java/com/eren/phoneinfo/MainActivity.kt"

          if [ -f "$FILE" ]; then
            sed -i 's/s\.maxRange/s.maximumRange/g' "$FILE"
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.find.outputs.dir }}"
          gradle --no-daemon assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneInfo-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
