name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q PhoneInfo.zip && sed -i 's/s\.maxRange/s.maximumRange/' PhoneInfo/app/src/main/java/com/eren/phoneinfo/MainActivity.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: cd PhoneInfo && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneInfo-apk
          path: PhoneInfo/app/build/outputs/apk/debug/app-debug.apk
