name: PhoneInfo v3.0 APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack updated project if needed
        shell: bash
        run: |
          set -euo pipefail

          # Prefer the supplied v3 archive so an older extracted copy cannot win.
          ZIP_PATH=""
          for candidate in PhoneInfo-v3.0.zip PhoneInfo-fixed2.zip PhoneInfo-fixed.zip PhoneInfo.zip; do
            if [ -f "$candidate" ]; then
              ZIP_PATH="$candidate"
              break
            fi
          done

          if [ -n "$ZIP_PATH" ]; then
            echo "Unpacking project archive: $ZIP_PATH"
            unzip -oq "$ZIP_PATH" -d .
          else
            SETTINGS="$(find . -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -not -path './.git/*' -not -path '*/build/*' -not -path '*/.gradle/*' \
              -print -quit || true)"
            if [ -z "$SETTINGS" ]; then
              echo "ERROR: No Gradle settings file or project ZIP was found."
              find . -maxdepth 4 -type f -print | sort | head -200
              exit 1
            fi
          fi

          echo "=== Project candidates ==="
          find . -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -not -path './.git/*' -not -path '*/build/*' -not -path '*/.gradle/*' -print

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Gradle project directory
        id: find
        shell: bash
        run: |
          set -euo pipefail

          if [ -f PhoneInfo/settings.gradle.kts ]; then
            SETTINGS_FILE="PhoneInfo/settings.gradle.kts"
          elif [ -f PhoneInfo/settings.gradle ]; then
            SETTINGS_FILE="PhoneInfo/settings.gradle"
          elif [ -f settings.gradle.kts ]; then
            SETTINGS_FILE="settings.gradle.kts"
          elif [ -f settings.gradle ]; then
            SETTINGS_FILE="settings.gradle"
          else
            SETTINGS_FILE="$(find . -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -not -path './.git/*' -not -path '*/build/*' -not -path '*/.gradle/*' \
              -print -quit || true)"
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle project not found after extraction."
            find . -maxdepth 6 -type f -print | sort | head -250
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Selected project: $PROJECT_DIR"
          test -f "$PROJECT_DIR/app/build.gradle.kts" || test -f "$PROJECT_DIR/app/build.gradle"

      - name: Enable AndroidX
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="${{ steps.find.outputs.dir }}"
          FILE="$PROJECT_DIR/gradle.properties"
          touch "$FILE"
          if grep -q '^android\.useAndroidX=' "$FILE"; then
            sed -i 's/^android\.useAndroidX=.*/android.useAndroidX=true/' "$FILE"
          else
            printf '\nandroid.useAndroidX=true\n' >> "$FILE"
          fi
          grep '^android.useAndroidX=' "$FILE"

      - name: Fix maxRange compatibility
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.find.outputs.dir }}"
          FILE="$PROJECT_DIR/app/src/main/java/com/eren/phoneinfo/MainActivity.kt"
          if [ -f "$FILE" ]; then
            sed -i 's/s\.maxRange/s.maximumRange/g' "$FILE"
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.find.outputs.dir }}"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneInfo-v3.0-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
