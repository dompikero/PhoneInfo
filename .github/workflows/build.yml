name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug - List files
        run: |
          echo "=== Kök dizin ==="
          ls -la
          echo ""
          echo "=== Zip var mı? ==="
          ls -la *.zip 2>/dev/null || echo "Zip yok"

      - name: Unzip if needed
        run: |
          if [ -f PhoneInfo.zip ]; then
            echo "PhoneInfo.zip bulundu, açılıyor..."
            unzip -q PhoneInfo.zip
          else
            echo "PhoneInfo.zip yok, mevcut dosyalarla devam ediliyor"
          fi
          echo ""
          echo "=== Açıldıktan sonra ==="
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Find project directory
        id: find
        run: |
          if [ -f PhoneInfo/settings.gradle.kts ]; then
            echo "dir=PhoneInfo" >> $GITHUB_OUTPUT
            echo "Proje: PhoneInfo/"
          elif [ -f settings.gradle.kts ]; then
            echo "dir=." >> $GITHUB_OUTPUT
            echo "Proje: kök dizin"
          else
            echo "HATA: Gradle projesi bulunamadı!"
            find . -name "settings.gradle*" -o -name "build.gradle*"
            exit 1
          fi

      - name: Fix maxRange (safe)
        run: |
          DIR="${{ steps.find.outputs.dir }}"
          FILE="$DIR/app/src/main/java/com/eren/phoneinfo/MainActivity.kt"
          if [ -f "$FILE" ]; then
            sed -i 's/s\.maxRange/s.maximumRange/g' "$FILE" || true
          fi

      - name: Build Debug APK
        run: |
          cd ${{ steps.find.outputs.dir }}
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneInfo-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
